<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<!-- Teacher — the course builder for E Learn (1ovr1 record, UCA 3.0).
     A teacher's courses, each with its curriculum (sections and lessons: add, rename, reorder by dragging
     or with the arrow keys, free preview, delete) and its details (title, subtitle, description, level,
     URL, cover, tags), published, unpublished, archived or deleted from here.
     Data: the elearn Supabase project's RPCs, the same ones Teacher mode and the Classroom use —
     lms_catalog and lms_course_outline to read, lms_author (upsert_course / upsert_module / upsert_lesson,
     delete_*, publish_course) to write. Every write is checked server-side by lms.author_guard (an owner,
     admin or instructor of the merchant). The session comes from the shell on app:restore; the app token
     is refreshed through the project's xano-session exchange. Everything shown comes from componentProps. -->
<style>
  :root { color-scheme: light; }
  :root.dark { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; }
  .muted { color: var(--muted); }
  .grow { flex: 1; min-width: 0; }

  #app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100%; }
  #app[data-size="phone"] { display: block; }
  #app[data-size="phone"][data-pane="list"] #main { display: none; }
  #app[data-size="phone"][data-pane="course"] #side { display: none; }
  #app[data-size="phone"] #side, #app[data-size="phone"] #main { height: 100%; }

  /* buttons */
  .btn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-weight: 550; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--bad); }
  .btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--accent-text); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
  .btn[disabled] { opacity: .45; cursor: default; filter: none; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ib { all: unset; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; color: var(--muted); flex-shrink: 0; }
  .ib:hover { background: var(--hover); color: var(--text); }
  .ib.danger:hover { color: var(--bad); }
  .ib:focus-visible { outline: 2px solid var(--accent); }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 10px; background: var(--chip); color: var(--chip-text); font-size: 11px; font-weight: 600; white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }

  /* sidebar: the teacher's courses */
  #side { display: flex; flex-direction: column; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .side-top { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px; }
  .side-top h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .side-scope { padding: 0 12px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search { display: flex; align-items: center; gap: 6px; margin: 8px 12px 6px; padding: 5px 8px; border-radius: 7px; background: var(--input); color: var(--muted); }
  .search input { all: unset; flex: 1; min-width: 0; color: var(--text); }
  #courses { overflow-y: auto; flex: 1; padding: 2px 8px 12px; }
  .grp { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 6px 4px; }
  .course { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; width: 100%; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
  .course:hover { background: var(--hover); }
  .course[aria-current="true"] { background: var(--selected); color: var(--selected-text); }
  .course[aria-current="true"] .cmeta { color: var(--selected-sub); }
  .course:focus-visible { outline: 2px solid var(--accent); }
  .course.archived { opacity: .7; }
  .ctitle { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmeta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile { width: 40px; height: 40px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--tile-text); font-weight: 700; font-size: 16px; overflow: hidden; flex-shrink: 0; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.lg { width: 56px; height: 56px; border-radius: 12px; font-size: 22px; }
  .side-note { padding: 18px 12px; color: var(--muted); }

  /* main */
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  #head { display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; border-bottom: 1px solid var(--line-soft); }
  #head h2 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 3px; color: var(--muted); font-size: 12px; }
  .saving { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .saving.bad { color: var(--bad); }
  #tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .tab { all: unset; padding: 9px 10px 8px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); }
  #pane { flex: 1; overflow-y: auto; padding: 18px 20px 40px; }
  .wrap { max-width: var(--content-max); margin: 0 auto; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  .empty h3 { color: var(--text); margin: 0 0 6px; font-size: 15px; }
  .empty .btn { margin-top: 14px; }

  /* curriculum */
  .curr-sum { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
  .sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
  .sec-h { display: flex; align-items: center; gap: 6px; padding: 8px 10px 2px 6px; }
  .sec-n { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .inl { all: unset; box-sizing: border-box; min-width: 0; padding: 4px 6px; border-radius: 6px; border: 1px solid transparent; }
  .inl:hover { border-color: var(--line); }
  .inl:focus { border-color: var(--accent); background: var(--input); }
  .sec-title { flex: 1; font-size: 15px; font-weight: 650; }
  .sec-sum { display: block; width: calc(100% - 52px); margin: 0 10px 6px 42px; color: var(--muted); font-size: 12.5px; resize: none; white-space: pre-wrap; field-sizing: content; min-height: 24px; }
  .lessons { padding: 2px 8px 4px; }
  .les { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 0; border-radius: 8px; border-top: 1px solid var(--line-soft); background: var(--card); }
  .les:first-child { border-top-color: transparent; }
  .les:hover { background: var(--hover); }
  .les .kind { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 7px; background: var(--chip); color: var(--chip-text); flex-shrink: 0; }
  .les .kind svg.i { width: 14px; height: 14px; }
  .les-title { flex: 1; }
  .dur { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 44px; text-align: right; }
  .toggle { all: unset; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--muted); border: 1px dashed var(--line); white-space: nowrap; }
  .toggle[aria-pressed="true"] { color: var(--ok); background: var(--ok-bg); border: 1px solid transparent; }
  .toggle:focus-visible { outline: 2px solid var(--accent); }
  .grip { all: unset; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 28px; border-radius: 5px; color: var(--muted); cursor: grab; touch-action: none; flex-shrink: 0; opacity: .55; }
  .grip:hover, .grip:focus-visible { opacity: 1; background: var(--hover); }
  .grip:focus-visible { outline: 2px solid var(--accent); }
  .dragging { position: relative; z-index: 2; box-shadow: var(--shadow-lg); opacity: .96; }
  .dragging .grip { cursor: grabbing; }
  .drag-on { cursor: grabbing; user-select: none; -webkit-user-select: none; }
  .les-empty { padding: 8px 10px 10px 42px; color: var(--muted); font-size: 12.5px; }
  .add-btn { all: unset; display: inline-flex; align-items: center; gap: 6px; margin: 2px 10px 10px 38px; padding: 5px 8px; border-radius: 7px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .add-btn:hover { background: var(--hover); }
  .add-btn:focus-visible { outline: 2px solid var(--accent); }
  .add-les { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 10px 12px 38px; padding: 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .kinds { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--input); }
  .kinds button { all: unset; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .kinds button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }
  .kinds button:focus-visible { outline: 2px solid var(--accent); }
  .kinds svg.i { width: 14px; height: 14px; }
  .field { all: unset; box-sizing: border-box; height: 30px; padding: 0 9px; border-radius: 7px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
  .field:focus { border-color: var(--accent); }
  .add-les .field { flex: 1; min-width: 160px; }
  .add-sec { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 12px; border-radius: 12px; border: 1.5px dashed var(--line); color: var(--accent); font-weight: 650; cursor: pointer; }
  .add-sec:hover { background: var(--hover); }
  .add-sec:focus-visible { outline: 2px solid var(--accent); }

  /* details */
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .form .full { grid-column: 1 / -1; }
  .lbl { display: flex; flex-direction: column; gap: 5px; font-weight: 600; font-size: 12px; }
  .lbl .hint { font-weight: 400; color: var(--muted); }
  .lbl .field, .lbl textarea, .lbl select { width: 100%; }
  .lbl input, .lbl textarea, .lbl select, .tags input { font-weight: 400; font-size: 13px; }
  textarea.field { height: auto; padding: 7px 9px; resize: vertical; line-height: 1.45; white-space: pre-wrap; }
  select.field { appearance: none; -webkit-appearance: none; background: var(--card) var(--chevron) no-repeat right 9px center / 10px 6px; padding-right: 26px; }
  .prefixed { display: flex; align-items: center; border-radius: 7px; border: 1px solid var(--line); background: var(--card); overflow: hidden; }
  .prefixed span { padding: 0 4px 0 9px; color: var(--muted); white-space: nowrap; }
  .prefixed input { all: unset; flex: 1; min-width: 0; height: 28px; padding-right: 9px; }
  .prefixed:focus-within { border-color: var(--accent); }
  .cover-row { display: flex; gap: 10px; align-items: center; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 30px; padding: 3px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); }
  .tags:focus-within { border-color: var(--accent); }
  .tags .chip button { all: unset; cursor: pointer; padding: 0 2px; color: var(--muted); }
  .tags input { all: unset; flex: 1; min-width: 120px; height: 22px; }
  .form-actions { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
  .dzone { margin-top: 32px; border: 1px solid var(--bad-line); border-radius: 12px; }
  .dzone h3 { margin: 0; padding: 12px 14px 0; font-size: 13px; color: var(--bad); }
  .drow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .drow + .drow { border-top: 1px solid var(--line-soft); }
  .drow b { display: block; }
  .drow .muted { font-size: 12px; }

  /* dialog */
  #modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--scrim); padding: 16px; z-index: 10; }
  .dlg { width: 100%; max-width: 440px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 18px 18px 14px; }
  .dlg h3 { margin: 0 0 6px; font-size: 15px; }
  .dlg p { margin: 0 0 12px; color: var(--muted); white-space: pre-line; }
  .dlg .lbl { margin-bottom: 12px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 7px 12px; border-radius: 8px; background: var(--toast); color: var(--toast-text); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast[data-on] { opacity: 1; }
  #fatal { margin: 24px; white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; color: var(--bad); }

  /* shared pieces for the lesson editor and the course tabs */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow-sm); }
  .card + .card { margin-top: 14px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card > .muted { margin: 0 0 12px; font-size: 12.5px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .num { font-variant-numeric: tabular-nums; }
  .check { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; padding: 6px 0; }
  .check input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .check b { display: block; font-weight: 600; }
  .check span.muted { display: block; font-size: 12px; }
  .seg-ctl { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--input); flex-wrap: wrap; }
  .seg-ctl label { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg-ctl input { position: absolute; opacity: 0; pointer-events: none; }
  .seg-ctl label:has(input:checked) { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }
  .seg-ctl label:has(input:focus-visible) { outline: 2px solid var(--accent); }
  .problems { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
  .problems ul { margin: 4px 0 0; padding-left: 18px; }
  .note { padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line-soft); color: var(--muted); font-size: 12.5px; }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl td.r, .tbl th.r { text-align: right; }
  .tbl tr[data-pick] { cursor: pointer; }
  .tbl tr[data-pick]:hover td { background: var(--hover); }
  .tbl tr[aria-selected="true"] td { background: var(--hover); }
  .bar-cell { display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .meter { flex: 1; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; min-width: 50px; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .meter.ok > i { background: var(--ok); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line-soft); }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .funnel { display: flex; flex-direction: column; gap: 6px; }
  .funnel .fr { display: grid; grid-template-columns: 120px 1fr 60px; gap: 10px; align-items: center; font-size: 12.5px; }
  .funnel .fb { height: 18px; border-radius: 5px; background: var(--chip); overflow: hidden; }
  .funnel .fb > i { display: block; height: 100%; background: var(--accent); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .search { margin: 0; flex: 1; min-width: 160px; }
  .menu-sel { all: unset; box-sizing: border-box; height: 26px; padding: 0 24px 0 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--card) var(--chevron) no-repeat right 8px center / 10px 6px; font-size: 12px; font-weight: 550; cursor: pointer; }
  .menu-sel:focus-visible { outline: 2px solid var(--accent); }

  /* lesson editor */
  .led { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 38%); gap: 18px; align-items: start; }
  .led.single { grid-template-columns: minmax(0, 1fr); max-width: var(--content-max); margin: 0 auto; }
  .blk { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .blk[aria-current="true"] { border-color: var(--accent); }
  .blk-h { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid var(--line-soft); }
  .blk-b { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .blk:focus-within { border-color: var(--accent); }
  .rte { min-height: 44px; line-height: 1.6; outline: none; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
  .rte.pull { font-style: italic; font-size: 14px; border-left: 3px solid var(--line); padding-left: 10px; }
  .rte:empty::before { content: attr(data-placeholder); color: var(--muted); }
  .rte .term { color: var(--accent); border-bottom: 1px dotted var(--accent); font-weight: 600; }
  .field.grow { flex: 1; }
  .tbl td.nw { white-space: nowrap; }
  .blk textarea { all: unset; box-sizing: border-box; display: block; width: 100%; min-height: 64px; white-space: pre-wrap; line-height: 1.55; field-sizing: content; }
  .blk textarea.pull { font-style: italic; font-size: 14px; border-left: 3px solid var(--line); padding-left: 10px; }
  .blk input.hd { all: unset; box-sizing: border-box; width: 100%; font-size: 17px; font-weight: 700; }
  .fmt { display: inline-flex; gap: 2px; }
  .fmt button { all: unset; min-width: 26px; height: 24px; padding: 0 6px; border-radius: 5px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .fmt button:hover { background: var(--hover); color: var(--text); }
  .fmt button:focus-visible { outline: 2px solid var(--accent); }
  .add-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px; border-radius: 10px; border: 1.5px dashed var(--line); }
  .add-bar .muted { font-size: 12px; margin-right: 4px; }
  .mats { margin-top: 16px; }
  .mat { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line-soft); }
  .mat:first-of-type { border-top: 0; }
  .mat .chip { min-width: 58px; justify-content: center; }
  .pv { position: sticky; top: 0; background: var(--paper); color: var(--paper-text); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px 28px; font: 15px/1.65 var(--reading-font); max-height: calc(100vh - 160px); overflow-y: auto; }
  .pv-k { font: 600 11px/1.3 var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
  .pv h1 { font-size: 24px; line-height: 1.25; margin: 0 0 4px; }
  .pv .pv-meta { font: 12px var(--font); color: var(--muted); margin-bottom: 16px; }
  .pv h2 { font-size: 18px; margin: 20px 0 8px; }
  .pv p { margin: 0 0 12px; }
  .pv p.pull { font-style: italic; font-size: 17px; border-left: 3px solid var(--accent); padding-left: 14px; }
  .pv .term { color: var(--accent); border-bottom: 1px dotted var(--accent); font-weight: 600; }
  .pv figure { margin: 12px 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .pv figure img { display: block; max-width: 100%; margin: 0 auto 6px; }
  .pv figcaption { font: 12px var(--font); color: var(--muted); }
  .pv .ex { display: flex; align-items: center; gap: 8px; margin: 10px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: 13px var(--font); }
  .pv .gate { font: 11px var(--font); color: var(--warn); border-top: 1px dashed var(--warn); margin: 12px 0 8px; padding-top: 4px; }
  .pv [data-pv][aria-current="true"] { background: var(--hover); border-radius: 4px; }
  .pv-empty { color: var(--muted); font: 13px var(--font); }
  .q { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; background: var(--card); }
  .q-h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .q-h .q-n { font-weight: 700; color: var(--muted); font-size: 12px; min-width: 22px; }
  .q-h .grow .field { width: 100%; }
  .opt { display: flex; align-items: center; gap: 6px; margin: 4px 0 4px 28px; }
  .opt .field { flex: 1; height: 28px; }
  .opt .mark { all: unset; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid var(--line); color: transparent; cursor: pointer; flex-shrink: 0; }
  .opt .mark.multi { border-radius: 6px; }
  .opt .mark[aria-checked="true"] { background: var(--ok); border-color: var(--ok); color: var(--accent-text); }
  .opt .mark:focus-visible { outline: 2px solid var(--accent); }
  .opt .mark svg.i { width: 13px; height: 13px; }
  .q-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 0 28px; font-size: 12px; color: var(--muted); }
  .q-foot .field { height: 26px; width: 64px; }
  .seg { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--card); }
  .seg-h { display: flex; align-items: center; gap: 8px; }
  .seg-h .field { flex: 1; }
  .seg-r { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0 0 30px; font-size: 12px; color: var(--muted); }
  .seg-r .field { width: 76px; height: 28px; }
  .seg-q { margin: 10px 0 0 30px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .video-card { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
  .thumb { width: 200px; aspect-ratio: 16 / 9; border-radius: 10px; background: var(--chip); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); max-width: 100%; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .drop { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px; border-radius: 12px; border: 1.5px dashed var(--line); text-align: center; color: var(--muted); }
  .drop[data-over] { border-color: var(--accent); background: var(--hover); }
  .progress { width: 100%; height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .thread { padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .thread:first-child { border-top: 0; }
  .c-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .c-h b { color: var(--text); font-size: 13px; }
  .c-body { margin: 4px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .replies { margin-left: 18px; padding-left: 12px; border-left: 2px solid var(--line-soft); }
  .reply-box { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; }
  .reply-box textarea { flex: 1; min-height: 56px; }
  .tabs-x { overflow-x: auto; scrollbar-width: none; }
  .tabs-x::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; }

  .only-phone { display: none; }
  #app[data-size="phone"] .only-phone { display: inline-flex; }
  #head [data-act="back"] { display: none; }
  #app[data-size="phone"] #head [data-act="back"] { display: inline-flex; }
  #app[data-size="phone"] #head { padding: 10px 12px 8px; gap: 6px 8px; flex-wrap: wrap; }
  #app[data-size="phone"] #head > .grow { flex-basis: calc(100% - 44px); }
  #app[data-size="phone"] #head .saving { flex: 1; text-align: left; padding-left: 36px; }
  #app[data-size="phone"] .les { flex-wrap: wrap; row-gap: 2px; padding-bottom: 6px; }
  #app[data-size="phone"] .les-title { flex: 1 1 calc(100% - 64px); }
  #app[data-size="phone"] .les .toggle { margin-left: 56px; }
  #app[data-size="phone"] .les .btn.sm { margin-left: auto; }
  #app[data-size="phone"] .sec-count { display: none; }
  #app[data-size="phone"] #head .tile.lg { display: none; }
  #app[data-size="phone"] #pane { padding: 12px 10px 32px; }
  #app[data-size="phone"] .form { grid-template-columns: 1fr; }
  #app[data-size="phone"] .dur, #app[data-size="phone"] .sec-n { display: none; }
  #app[data-size="phone"] .les .btn.sm { padding: 0 7px; }
  #app[data-size="phone"] .add-les, #app[data-size="phone"] .add-btn, #app[data-size="phone"] .les-empty { margin-left: 8px; padding-left: 8px; }
  #app[data-size="phone"] .sec-sum { margin-left: 10px; width: calc(100% - 20px); }
  #app[data-size="phone"] .drow { flex-wrap: wrap; }
  #app[data-size="phone"] .led { grid-template-columns: minmax(0, 1fr); }
  #app[data-size="phone"] .led > .pv-col[data-hide] { display: none; }
  #app[data-size="phone"] .pv { position: static; max-height: none; }
  #app[data-size="phone"] .video-card { grid-template-columns: 1fr; }
  #app[data-size="phone"] .funnel .fr { grid-template-columns: 90px 1fr 44px; }
  #app[data-size="phone"] .opt, #app[data-size="phone"] .q-foot, #app[data-size="phone"] .seg-r, #app[data-size="phone"] .seg-q { margin-left: 0; }
  @media (prefers-reduced-motion: reduce) { .progress > i, #toast { transition: none; } }
</style>
</head>
<body>
<div id="app" data-size="wide" data-pane="list" hidden>
  <aside id="side">
    <div class="side-top"><h1 id="side-title" class="grow"></h1><button class="btn sm primary" id="btn-new" type="button"></button></div>
    <div class="side-scope" id="side-scope"></div>
    <label class="search"><span id="search-icon"></span><span class="sr" id="search-label"></span><input id="search" type="search" aria-labelledby="search-label"></label>
    <div id="courses" role="list"></div>
  </aside>
  <main id="main">
    <header id="head"></header>
    <nav id="tabs" class="tabs-x" role="tablist"></nav>
    <div id="pane" role="tabpanel"></div>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<script>
var componentProps = {};
</script>
<script>
(function () {
  "use strict";

  /* ── props (the only source of truth; a missing one stops the app with its name) ─────────────── */
  function Missing(path) { this.message = "componentProps." + path + " is not configured"; }
  function need(path) {
    var v = path.split(".").reduce(function (o, k) { return o == null ? undefined : o[k]; }, componentProps);
    if (v === undefined || v === null) throw new Missing(path);
    return v;
  }
  function t(key, vars) {
    var s = need("strings")[key];
    if (s === undefined) throw new Missing("strings." + key);
    return String(s).replace(/\{(\w+)\}/g, function (_, k) { return vars && vars[k] != null ? vars[k] : ""; });
  }
  function plural(key, n) { return t(key + (n === 1 ? "One" : "Many"), { n: n }); }
  function icon(name) {
    var d = need("icons")[name];
    if (d === undefined) throw new Missing("icons." + name);
    return '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"></path></svg>';
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(s) { return document.querySelector(s); }
  function byId(list, id) { return list.filter(function (x) { return String(x.id) === String(id); })[0] || null; }

  var LUT = {};
  var S = {
    scheme: null, restored: false,
    profile: null, roles: {}, // who is editing, from app:restore
    tok: { value: null, at: 0, ttl: 0, session: null, refreshing: null },
    catalog: { loaded: false, loading: null, error: null },
    courses: [], // the catalog rows this teacher may author
    openSlug: null, course: null, courseError: null, courseLoading: false,
    tab: null, pane: "list", query: "",
    form: null, // the details form while it's being edited
    adding: null, addKind: null, // the section whose add-lesson form is open, and the kind picked
    saving: 0, saveError: null, queue: Promise.resolve(),
    L: null, // the lesson open in the editor
    T: {}, // the open course's other tabs (pricing, roster, insights, comments, certificates), loaded when first shown
    displayName: null, pendingLesson: null, pendingLtab: null,
  };

  /* ── 1. CSS props: theme tokens for the scheme in force ─────────────────────────────────────── */
  function applyCSSProps() {
    var scheme = S.scheme || need("theme.defaultScheme");
    var tokens = need("theme." + scheme);
    var root = document.documentElement;
    Object.keys(tokens).forEach(function (k) { root.style.setProperty("--" + k, tokens[k]); });
    var L = need("layout");
    root.style.setProperty("--side-w", L.sidebarWidth + "px");
    root.style.setProperty("--content-max", L.contentMax + "px");
    root.classList.toggle("dark", scheme === "dark");
  }

  /* ── 2. LUT from props ───────────────────────────────────────────────────────────────────────── */
  function buildLUT() {
    LUT.sb = need("config.supabase_url");
    LUT.sbKey = need("config.supabase_key");
    LUT.exchange = need("config.session_exchange");
    LUT.scoped = need("config.merchant_scoped_rpc");
    LUT.catalogStatuses = need("config.catalog_statuses");
    LUT.authorRoles = need("config.author_roles");
    LUT.slugTries = need("config.slug_tries");
    LUT.videoCreate = need("config.video_create_url"); // "" until the video service is deployed
    LUT.tus = need("config.tus_endpoint");
    LUT.chunkBytes = need("config.upload_chunk_bytes");
    LUT.signSeconds = need("config.sign_seconds");
    LUT.thumbFile = need("config.thumbnail_file");
    LUT.videoAccept = need("config.video_accept");
    LUT.locale = need("formats.locale");
    LUT.lessonTabs = need("lesson_tabs");
    LUT.blockKinds = need("block_kinds"); LUT.blockKind = {};
    LUT.blockKinds.forEach(function (b) { LUT.blockKind[b.id] = b; });
    LUT.materialKinds = need("material_kinds"); LUT.materialKind = {};
    LUT.materialKinds.forEach(function (m) { LUT.materialKind[m.id] = m; });
    LUT.qkind = need("question_kinds");
    LUT.questionTypes = need("question_types");
    LUT.examKinds = need("exam_kinds");
    LUT.defaults = need("defaults");
    LUT.currencies = need("currencies");
    LUT.access = need("access");
    LUT.courseFlags = need("course_flags");
    LUT.enrollStatuses = need("enrollment_statuses");
    LUT.commentFilters = need("comment_filters");
    LUT.statuses = need("statuses"); LUT.status = {};
    LUT.statuses.forEach(function (s) { LUT.status[s.id] = s; });
    LUT.kinds = need("kinds"); LUT.kind = {};
    LUT.kinds.forEach(function (k) { LUT.kind[k.id] = k; });
    LUT.levels = need("levels");
    LUT.tabs = need("tabs");
    LUT.layout = need("layout");
    LUT.tiles = need("theme.tiles");
    var v = componentProps._viewer || {};
    LUT.viewId = v.requested_view != null ? v.requested_view : null;
    LUT.merchant = v.merchant_id ? Number(v.merchant_id) : null;
    LUT.merchantName = (v.merchant && (v.merchant.business_name || v.merchant.name)) || null;
    // Opened from the Classroom for a channel the viewer authors: it leaves that merchant here.
    if (LUT.merchant == null) {
      try {
        var b = JSON.parse(sessionStorage.getItem(need("config.builders_key")) || "null");
        if (b && b.merchant_id) { LUT.merchant = Number(b.merchant_id); LUT.merchantName = b.name || null; }
      } catch (e) { /* storage blocked: no handoff */ }
    }
  }

  /* ── the app token (the store's verified identity), refreshed before it lapses ──────────────── */
  function tokenFresh() { return !!(S.tok.value && (Date.now() - S.tok.at) < (S.tok.ttl - 120) * 1000); }
  function refreshToken() {
    if (!S.tok.session) return Promise.resolve(S.tok.value);
    if (S.tok.refreshing) return S.tok.refreshing;
    S.tok.refreshing = fetch(LUT.sb + LUT.exchange, { method: "POST", headers: { Authorization: "Bearer " + S.tok.session, "Content-Type": "application/json" }, body: "{}" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.app_token) { S.tok.value = j.app_token; S.tok.at = Date.now(); S.tok.ttl = j.expires_in || S.tok.ttl; } return S.tok.value; })
      .catch(function () { return S.tok.value; })
      .then(function (v) { S.tok.refreshing = null; return v; });
    return S.tok.refreshing;
  }
  function bearer() { return (S.tok.session && !tokenFresh()) ? refreshToken() : Promise.resolve(S.tok.value); }

  /* ── the store ───────────────────────────────────────────────────────────────────────────────── */
  function friendly(j, status) {
    var code = j && j.code;
    if (code === "28000") return t("errSignedOut");
    if (code === "42501") return t("errNoRole");
    if (code === "23505") return t("errSlugTaken");
    if (code === "P0002") return t("errNotFound");
    return String((j && (j.message || j.error)) || ("HTTP " + status)).slice(0, 160);
  }
  function rpc(name, args, retried) {
    var a = Object.assign({}, args || {});
    if (LUT.merchant != null && LUT.scoped.indexOf(name) > -1 && a.p_merchant_id === undefined) a.p_merchant_id = LUT.merchant;
    return bearer().then(function (tok) {
      return fetch(LUT.sb + "/rest/v1/rpc/" + name, {
        method: "POST",
        headers: { apikey: LUT.sbKey, Authorization: "Bearer " + (tok || LUT.sbKey), "Content-Type": "application/json" },
        body: JSON.stringify(a),
      });
    }).then(function (r) {
      if (r.status === 401 && S.tok.session && !retried) return refreshToken().then(function () { return rpc(name, args, true); });
      return r.text().then(function (txt) {
        var j = null;
        try { j = JSON.parse(txt); } catch (e) {}
        if (!r.ok) { var err = new Error(friendly(j, r.status)); err.code = j && j.code; err.status = r.status; throw err; }
        return j;
      });
    });
  }
  function author(action, payload) {
    return rpc("lms_author", { p_action: action, p_payload: payload }).then(function (r) {
      if (r && r.error) throw new Error(String(r.error));
      return r;
    });
  }
  // Writes go one at a time, in order (a reorder is several of them), and the header says how it went.
  function write(fn) {
    S.saving++; S.saveError = null; renderSaving();
    var p = S.queue.then(fn);
    S.queue = p.catch(function () {});
    return p.then(function (v) { S.saving--; renderSaving(); return v; }, function (e) {
      S.saving--; S.saveError = e.message; renderSaving(); toast(t("saveFailed", { reason: e.message }));
      throw e;
    });
  }
  function post(msg) { try { window.parent.postMessage(msg, "*"); } catch (e) {} }
  function remember() { post({ gin: "app:state", view_id: LUT.viewId, state: { open: S.openSlug, tab: S.tab, lesson: S.L ? S.L.id : null, ltab: S.L ? S.L.tab : null } }); }

  /* ── data ─────────────────────────────────────────────────────────────────────────────────── */
  function signedIn() { return S.profile != null && !!(S.tok.value || S.tok.session); }
  function mayAuthor(c) {
    var role = S.roles[String(c.merchant_id)];
    return LUT.authorRoles.indexOf(role) > -1 || (S.profile != null && c.created_by != null && Number(c.created_by) === Number(S.profile));
  }
  function loadCatalog() {
    if (!signedIn()) { S.catalog.error = "signed-out"; render(); return Promise.resolve(); }
    if (S.catalog.loading) return S.catalog.loading;
    S.catalog.loading = Promise.all(LUT.catalogStatuses.map(function (st, i) {
      var q = rpc("lms_catalog", { p_status: st, p_user_id: S.profile });
      return i === 0 ? q : q.catch(function () { return []; }); // the first status must load; others may be refused
    })).then(function (res) {
      var rows = [].concat.apply([], res.map(function (r) { return Array.isArray(r) ? r : []; })).filter(mayAuthor);
      if (LUT.merchant != null) rows = rows.filter(function (c) { return Number(c.merchant_id) === LUT.merchant; });
      S.courses = rows.map(adoptRow);
      S.catalog = { loaded: true, loading: null, error: null };
      if (S.openSlug && !byslug(S.openSlug)) { S.openSlug = null; S.course = null; S.pane = "list"; }
      render();
      if (S.openSlug && !S.course) loadCourse();
    }).catch(function (e) {
      S.catalog.loading = null; S.catalog.error = e.message; render();
    });
    return S.catalog.loading;
  }
  function adoptRow(c) {
    return { id: c.id, slug: c.slug, title: c.title || "", subtitle: c.subtitle || "", status: c.status, cover_url: c.cover_url || "",
      merchant_id: c.merchant_id, created_by: c.created_by, learners: Number(c.learner_count) || 0,
      modules: Number(c.module_count) || 0, lessons: Number(c.lesson_count) || 0, updated_at: c.updated_at || null };
  }
  function byslug(slug) { return S.courses.filter(function (c) { return c.slug === slug; })[0] || null; }
  function rowOf(course) { return course ? byId(S.courses, course.id) : null; }
  function adoptCourse(j) {
    var mods = (j.modules || []).slice().sort(function (a, b) { return a.position - b.position; });
    return {
      id: j.id, slug: j.slug, title: j.title || "", subtitle: j.subtitle || "", description: j.description || "",
      level: j.level || "", cover_url: j.cover_url || "", tags: Array.isArray(j.tags) ? j.tags.slice() : [], status: j.status,
      modules: mods.map(function (m) {
        return { id: m.id, position: m.position, title: m.title || "", summary: m.summary || "",
          lessons: (m.lessons || []).slice().sort(function (a, b) { return a.position - b.position; }).map(function (l) {
            return { id: l.id, position: l.position, title: l.title || "", kind: l.kind, duration_seconds: Number(l.duration_seconds) || 0, is_preview: !!l.is_preview };
          }) };
      }),
    };
  }
  function loadCourse() {
    var slug = S.openSlug; if (!slug) return Promise.resolve();
    S.courseLoading = true; S.courseError = null; renderMain();
    return rpc("lms_course_outline", { p_slug: slug, p_user_id: S.profile }).then(function (j) {
      if (slug !== S.openSlug) return;
      if (!j || j.error) throw new Error(t("errNotFound"));
      S.course = adoptCourse(j); S.courseLoading = false; S.form = null;
      syncRow(); render();
      if (S.pendingLesson && lessonById(S.pendingLesson)) openLesson(S.pendingLesson, S.pendingLtab);
      S.pendingLesson = null;
    }).catch(function (e) {
      if (slug !== S.openSlug) return;
      S.courseLoading = false; S.courseError = e.message; renderMain();
    });
  }
  // The sidebar's counts follow the open course as it's edited.
  function syncRow() {
    var c = S.course, row = rowOf(c); if (!row) return;
    row.title = c.title; row.subtitle = c.subtitle; row.status = c.status; row.cover_url = c.cover_url; row.slug = c.slug;
    row.modules = c.modules.length; row.lessons = lessonCount(c);
  }
  function lessonCount(c) { return c.modules.reduce(function (n, m) { return n + m.lessons.length; }, 0); }
  function seconds(c) { return c.modules.reduce(function (n, m) { return n + m.lessons.reduce(function (k, l) { return k + l.duration_seconds; }, 0); }, 0); }
  function duration(sec) {
    if (!sec) return "";
    var m = Math.max(1, Math.round(sec / 60));
    return m < 60 ? t("minutes", { n: m }) : t("hoursMinutes", { h: Math.floor(m / 60), m: m % 60 });
  }
  function slugify(s) { return String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }

  /* ── rendering ───────────────────────────────────────────────────────────────────────────────── */
  function tile(c, big) {
    var pal = LUT.tiles, bg = pal[Math.abs(Number(c.id) || 0) % pal.length];
    var inner = c.cover_url ? '<img alt="" src="' + esc(c.cover_url) + '">' : esc((c.title || "?").trim().charAt(0).toUpperCase());
    return '<span class="tile' + (big ? " lg" : "") + '" style="background:' + esc(bg) + '" aria-hidden="true">' + inner + "</span>";
  }
  function statusChip(id) {
    var s = LUT.status[id]; if (!s) return "";
    return '<span class="chip ' + esc(s.tone) + '">' + esc(s.label) + "</span>";
  }
  function render() { renderSide(); renderMain(); }
  function renderSide() {
    $("#side-scope").textContent = LUT.merchantName ? t("scope", { name: LUT.merchantName }) : "";
    var el = $("#courses");
    $("#btn-new").disabled = !signedIn();
    if (!signedIn()) { el.innerHTML = '<div class="side-note">' + esc(t("signedOut")) + "</div>"; return; }
    if (!S.catalog.loaded) {
      el.innerHTML = '<div class="side-note">' + esc(S.catalog.error ? t("loadFailed", { reason: S.catalog.error }) : t("loading")) + "</div>";
      return;
    }
    var q = S.query.trim().toLowerCase();
    var rows = S.courses.filter(function (c) { return !q || (c.title + " " + c.subtitle).toLowerCase().indexOf(q) > -1; });
    if (!S.courses.length) { el.innerHTML = '<div class="side-note">' + esc(t("noCourses")) + "</div>"; return; }
    if (!rows.length) { el.innerHTML = '<div class="side-note">' + esc(t("noMatches")) + "</div>"; return; }
    el.innerHTML = LUT.statuses.map(function (st) {
      var group = rows.filter(function (c) { return c.status === st.id; }).sort(function (a, b) { return a.title.localeCompare(b.title); });
      if (!group.length) return "";

    "lesson-save": function () { saveLesson(); },
    "lesson-revert": function () { S.L.draft = clone(S.L.saved); renderLessonView(); toast(t("reverted")); },
    "preview-toggle": function () { S.L.preview = !S.L.preview; renderContent(); },
    "add-block": function (a) {
      var d = S.L.draft, b = { id: key("b"), kind: a.dataset.bkind, body: "", material_slug: "", is_gated: d.blocks.length > 0 };
      d.blocks.push(b); S.L.sel = b.id; lessonChanged(true);
      var el = document.querySelector('.blk[data-id="' + b.id + '"] .rte, .blk[data-id="' + b.id + '"] input, .blk[data-id="' + b.id + '"] select');
      if (el) { el.focus(); el.scrollIntoView({ block: "center" }); }
    },
    "blk-del": function (a) { S.L.draft.blocks.splice(Number(a.dataset.i), 1); lessonChanged(true); },
    "blk-dup": function (a) { var i = Number(a.dataset.i), b = clone(S.L.draft.blocks[i]); b.id = key("b"); S.L.draft.blocks.splice(i + 1, 0, b); lessonChanged(true); },
    "blk-gate": function (a) { var b = S.L.draft.blocks[Number(a.dataset.i)]; b.is_gated = !b.is_gated; lessonChanged(true); },
    "fmt-bold": function (a) { boldSelection(Number(a.dataset.i)); },
    "fmt-term": function (a) { linkTerm(Number(a.dataset.i)); },
    "mat-new": function (a) { materialDialog(a.dataset.mkind, null, a.dataset.for != null ? Number(a.dataset.for) : null); },
    "mat-edit": function (a) { var m = matBySlug(a.dataset.slug); if (m) materialDialog(m.kind, m, null); },
    "mat-del": function (a) { deleteMaterial(a.dataset.slug); },
    "seg-add": function () { addSegment(); },
    "seg-del": function (a) { S.L.draft.segments.splice(Number(a.dataset.i), 1); lessonChanged(true); },
    "cp-add": function (a) { S.L.draft.segments[Number(a.dataset.i)].quiz = newCheckpoint(); lessonChanged(true); },
    "cp-del": function (a) { S.L.draft.segments[Number(a.dataset.i)].quiz = null; lessonChanged(true); },
    "q-add": function (a) {
      var qt = byId(LUT.questionTypes, a.dataset.qtype), list = getPath(S.L.draft, a.dataset.path); if (!qt || !list) return;
      var q = { id: key("q"), kind: qt.kind, prompt: "", options: clone(qt.options), answer: clone(qt.answer), points: LUT.defaults.points };
      list.push(q); lessonChanged(true);
      var el = document.querySelector('.q[data-id="' + q.id + '"] .q-h input'); if (el) { el.focus(); el.scrollIntoView({ block: "center" }); }
    },
    "q-del": function (a) { var p = at(a.dataset.path); p.list.splice(p.i, 1); lessonChanged(true); },
    "q-mark": function (a) {
      var q = getPath(S.L.draft, a.dataset.path), oi = Number(a.dataset.oi);
      if (q.kind === "multi") { var k = q.answer.indexOf(oi); if (k > -1) q.answer.splice(k, 1); else q.answer.push(oi); q.answer.sort(function (x, y) { return x - y; }); }
      else q.answer = oi;
      lessonChanged(true);
    },
    "opt-add": function (a) { getPath(S.L.draft, a.dataset.path).options.push(""); lessonChanged(true); },
    "opt-del": function (a) {
      var q = getPath(S.L.draft, a.dataset.path), oi = Number(a.dataset.oi);
      q.options.splice(oi, 1);
      if (q.kind === "multi") q.answer = q.answer.filter(function (x) { return x !== oi; }).map(function (x) { return x > oi ? x - 1 : x; });
      else q.answer = q.answer === oi ? -1 : q.answer > oi ? q.answer - 1 : q.answer;
      lessonChanged(true);
    },
    "upload-clear": function () { S.L.upload = null; renderLessonPane(); },
    "pricing-save": function () { savePricing(); },
    "pricing-discard": function () { var st = S.T.pricing; st.form = clone(st.saved); renderPricing(); },
    "student-add": function () { addStudent(); },
    "tab-retry": function () { S.T[S.tab === "students" || S.tab === "certificates" ? "roster" : S.tab] = null; if (S.tab === "insights") S.T.roster = null; renderMain(); },
    "cm-reply": function (a) { S.T.comments.reply = a.dataset.id; renderComments(); var f = document.querySelector('.reply-box[data-thread="' + a.dataset.id + '"] textarea'); if (f) f.focus(); },
    "cm-cancel": function () { S.T.comments.reply = null; renderComments(); },
    "cm-pin": function (a) { pinThread(a.dataset.id, true); },
    "cm-unpin": function (a) { pinThread(a.dataset.id, false); },
    "cert-set": function (a) { setCertificates(a.dataset.on === "1"); },
  };

  /* ── drag to reorder (pointer: mouse, pen and touch) ─────────────────────────────────────────── */
  function startDrag(e, grip) {
    var item = grip.closest("[data-item]"), list = item && item.parentElement; if (!list) return;
    e.preventDefault();
    var kind = item.dataset.item, before = ids(list, kind), scroller = $("#pane");
    // Listen on the window: moving the item in the page drops any pointer capture on its grip.
    var pid = e.pointerId;
    item.classList.add("dragging"); document.body.classList.add("drag-on");
    function ids(l, k) { return Array.prototype.filter.call(l.children, function (x) { return x.dataset.item === k; }).map(function (x) { return x.dataset.id; }); }
    function move(ev) {
      if (ev.pointerId !== pid) return;
      var sibs = Array.prototype.filter.call(list.children, function (x) { return x !== item && x.dataset.item === kind; });
      var target = null;
      for (var i = 0; i < sibs.length; i++) { var r = sibs[i].getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { target = sibs[i]; break; } }
      if (target) { if (item.nextElementSibling !== target) list.insertBefore(item, target); }
      else if (sibs.length && sibs[sibs.length - 1].nextElementSibling !== item) sibs[sibs.length - 1].after(item);
      var b = scroller.getBoundingClientRect(), edge = 40;
      if (ev.clientY < b.top + edge) scroller.scrollTop -= 12; else if (ev.clientY > b.bottom - edge) scroller.scrollTop += 12;
    }
    function up(ev) {
      if (ev.pointerId !== pid) return;
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
      item.classList.remove("dragging"); document.body.classList.remove("drag-on");
      var after = ids(list, kind);
      if (after.join() !== before.join()) { reorder(item, after); if (!draftList(item)) renderCurriculum(); }
    }
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  }

  /* ── wiring ──────────────────────────────────────────────────────────────────────────────────── */
  function size() {
    LUT.size = window.innerWidth < LUT.layout.phoneBelow ? "phone" : "wide";
    var app = $("#app");
    app.setAttribute("data-size", LUT.size);
    app.setAttribute("data-pane", S.openSlug ? S.pane : "list");
  }
  function wire() {
    $("#side-title").textContent = t("courses");
    $("#btn-new").innerHTML = icon("plus") + esc(t("new"));
    $("#btn-new").setAttribute("aria-label", t("newCourse"));
    $("#search-icon").innerHTML = icon("search");
    $("#search-label").textContent = t("search");
    $("#search").placeholder = t("search");
    $("#search").addEventListener("input", function () { S.query = this.value; renderSide(); });
    $("#btn-new").addEventListener("click", newCourse);
    $("#courses").addEventListener("click", function (e) { var b = e.target.closest(".course"); if (b) openCourse(b.dataset.slug); });

    var app = $("#app");
    app.addEventListener("click", function (e) {
      var lt = e.target.closest("[data-ltab]");
      if (lt && S.L) { S.L.tab = lt.dataset.ltab; renderLessonView(); remember(); return; }
      var pk = e.target.closest("tr[data-pick]");
      if (pk) { pickInsight(pk.dataset.pick); return; }
      var tab = e.target.closest("[data-tab]");
      if (tab) { S.tab = tab.dataset.tab; S.adding = null; renderMain(); remember(); return; }
      var kindBtn = e.target.closest("[data-kind]");
      if (kindBtn) {
        S.addKind = kindBtn.dataset.kind;
        kindBtn.parentElement.querySelectorAll("[data-kind]").forEach(function (b) { b.setAttribute("aria-pressed", String(b === kindBtn)); });
        var inp = kindBtn.closest("form").elements.title; if (inp) inp.focus();
        return;
      }
      var a = e.target.closest("[data-act]"); if (!a) return;
      var act = a.dataset.act, id = a.dataset.id;
      if (act === "back") { S.pane = "list"; size(); }
      else if (act === "new-course") newCourse();
      else if (act === "add-section") addSection();
      else if (act === "add-lesson") {
        S.adding = Number(a.dataset.module); S.addKind = S.addKind || LUT.kinds.filter(function (k) { return k.add; })[0].id;
        renderCurriculum();
        var f = document.querySelector('.add-les[data-module="' + a.dataset.module + '"] [name="title"]'); if (f) f.focus();
      }
      else if (act === "cancel-add") { S.adding = null; renderCurriculum(); }
      else if (act === "preview") togglePreview(id);
      else if (act === "edit") editLesson(id);
      else if (act === "del-lesson") deleteLesson(id);
      else if (act === "del-section") deleteSection(id);
      else if (act === "publish") publish();
      else if (act === "unpublish") unpublish();
      else if (act === "restore") setStatus(LUT.statuses[0].id, t("restored"));
      else if (act === "archive") archive();
      else if (act === "delete-course") deleteCourse();
      else if (act === "discard") { S.form = null; renderDetails(); }
      else if (act === "untag") { S.form.tags.splice(Number(a.dataset.i), 1); renderDetails(); syncFormButtons(); var ti = $("#tag-in"); if (ti) ti.focus(); }
      else if (ACT[act]) ACT[act](a, e);
    });
    app.addEventListener("change", function (e) {
      var el = e.target;
      if (el.dataset && el.dataset.field) { rename(el); return; }
      if (el.dataset && el.dataset.bind) { bindInput(el, true); return; }
      if (el.id === "video-file") { uploadVideo(el.files && el.files[0]); return; }
      if (el.id === "roster-filter") { S.T.roster.filter = el.value; renderStudents(); return; }
      if (el.dataset && el.dataset.member) { var v = el.value; el.value = ""; if (v) setAccess(el.dataset.member, v); return; }
      if (el.id === "cm-lesson") { S.T.comments.lesson = el.value; renderComments(); return; }
      if (el.id === "cm-filter") { S.T.comments.filter = el.value; renderComments(); return; }
    });
    app.addEventListener("input", function (e) {
      var el = e.target;
      if (el.dataset && el.dataset.rte != null) { rteChanged(el); return; }
      if (el.dataset && el.dataset.bind) { if (el.type !== "checkbox" && el.type !== "radio" && el.tagName !== "SELECT") bindInput(el, false); return; }
      if (el.id === "roster-q") {
        S.T.roster.q = el.value; renderStudents();
        var rq = $("#roster-q"); rq.focus(); rq.setSelectionRange(rq.value.length, rq.value.length);
        return;
      }
      var form = el.closest && el.closest("#details");
      if (!form || !el.name || !S.form || !(el.name in S.form) || el.name === "tags") return;
      S.form[el.name] = el.value;
      if (el.name === "slug") { var clean = el.value.toLowerCase().replace(/[^a-z0-9-]/g, "-"); if (clean !== el.value) { el.value = clean; S.form.slug = clean; } }
      if (el.name === "cover_url" || el.name === "title") {
        var tl = form.querySelector(".cover-row .tile");
        if (tl) tl.outerHTML = tile({ id: S.course.id, title: S.form.title, cover_url: S.form.cover_url }, true);
      }
      syncFormButtons();
    });
    app.addEventListener("submit", function (e) {
      e.preventDefault();
      if (e.target.id === "details") saveDetails();
      else if (e.target.classList.contains("add-les")) addLesson(e.target);
      else if (e.target.id === "attach-form") attachVideo(e.target.elements.guid.value);
      else if (e.target.classList.contains("reply-box")) sendReply(e.target);
    });
    app.addEventListener("mousedown", function (e) { if (e.target.closest && e.target.closest(".fmt button")) e.preventDefault(); });
    app.addEventListener("paste", function (e) {
      var el = e.target.closest && e.target.closest(".rte"); if (!el) return;
      e.preventDefault();
      document.execCommand("insertText", false, ((e.clipboardData && e.clipboardData.getData("text/plain")) || "").replace(/\s*\n\s*/g, " "));
    });
    app.addEventListener("focusin", function (e) {
      var blk = e.target.closest && e.target.closest(".blk");
      if (!blk || !S.L || S.L.sel === blk.dataset.id) return;
      S.L.sel = blk.dataset.id;
      document.querySelectorAll(".blk").forEach(function (b) { b.setAttribute("aria-current", String(b === blk)); });
      renderPreview();
    });
    // A video file dropped on the upload area.
    app.addEventListener("dragover", function (e) { var d = e.target.closest && e.target.closest("#drop"); if (d && LUT.videoCreate) { e.preventDefault(); d.setAttribute("data-over", ""); } });
    app.addEventListener("dragleave", function (e) { var d = e.target.closest && e.target.closest("#drop"); if (d) d.removeAttribute("data-over"); });
    app.addEventListener("drop", function (e) {
      var d = e.target.closest && e.target.closest("#drop"); if (!d || !LUT.videoCreate) return;
      e.preventDefault(); d.removeAttribute("data-over");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) uploadVideo(e.dataTransfer.files[0]);
    });
    app.addEventListener("keydown", function (e) {
      var el = e.target;
      if (el.dataset && el.dataset.field && e.key === "Enter" && el.tagName === "INPUT") { e.preventDefault(); el.blur(); return; }
      if (el.dataset && el.dataset.field && e.key === "Escape") {
        var it = el.dataset.field === "lesson-title" ? lessonById(el.dataset.id) : byId(S.course.modules, el.dataset.id);
        if (it) el.value = el.dataset.field === "module-summary" ? it.summary : it.title;
        el.blur(); return;
      }
      if (el.id === "tag-in" && (e.key === "Enter" || e.key === ",")) {
        e.preventDefault();
        var tag = el.value.trim().replace(/,$/, "");
        if (tag && S.form.tags.indexOf(tag) < 0) S.form.tags.push(tag);
        el.value = ""; renderDetails(); syncFormButtons(); $("#tag-in").focus();
        return;
      }
      if (el.id === "tag-in" && e.key === "Backspace" && !el.value && S.form.tags.length) { S.form.tags.pop(); renderDetails(); syncFormButtons(); $("#tag-in").focus(); return; }
      if (el.closest && el.closest(".add-les") && e.key === "Escape") { S.adding = null; renderCurriculum(); return; }
      if (el.dataset && el.dataset.rte != null) {
        var bi = Number(el.dataset.rte);
        if (e.key === "Enter") { e.preventDefault(); splitBlock(bi); return; }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); boldSelection(bi); return; }
        if (e.key === "Backspace" && !el.textContent && S.L.draft.blocks.length > 1) {
          e.preventDefault(); S.L.draft.blocks.splice(bi, 1); lessonChanged(true); focusEnd(rteOf(Math.max(0, bi - 1)));
          return;
        }
      }
      if (el.matches && el.matches("tr[data-pick]") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickInsight(el.dataset.pick); return; }
      if (el.matches && el.matches("[data-drag]") && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
        e.preventDefault(); step(el.closest("[data-item]"), e.key === "ArrowUp" ? -1 : 1);
      }
    });
    app.addEventListener("pointerdown", function (e) {
      var g = e.target.closest("[data-drag]");
      if (g && (e.button === 0 || e.pointerType !== "mouse")) startDrag(e, g);
    });
    window.addEventListener("resize", size);
  }

  /* ── the shell ───────────────────────────────────────────────────────────────────────────────── */
  window.addEventListener("message", function (e) {
    var d = e.data; if (!d || typeof d.gin !== "string") return;
    if (d.scheme && d.scheme !== S.scheme) { S.scheme = d.scheme; applyCSSProps(); }
    if (d.gin === "app:restore") {
      var u = d.user || null;
      S.profile = u ? (u.profile_id != null ? u.profile_id : (typeof u.id === "number" ? u.id : null)) : null;
      S.roles = (u && u.roles) || {};
      S.displayName = (u && (u.display_name || u.name)) || null;
      S.tok.value = (u && u.app_token) || null;
      S.tok.at = (u && u.app_token_at) || Date.now();
      S.tok.ttl = (u && u.app_token_expires_in) || 0;
      S.tok.session = (u && (u.auth_token || u.authToken)) || null;
      if (!S.restored && d.state && typeof d.state === "object") {
        if (d.state.open) { S.openSlug = d.state.open; S.pane = "course"; }
        if (d.state.tab && LUT.tabs.some(function (tb) { return tb.id === d.state.tab; })) S.tab = d.state.tab;
        if (d.state.lesson) { S.pendingLesson = d.state.lesson; S.pendingLtab = d.state.ltab || null; }
      }
      S.restored = true;
      if (!S.tab) S.tab = LUT.tabs[0].id;
      S.catalog.loaded = false; S.catalog.error = null;
      size(); render(); loadCatalog();
    } else if (d.gin === "auth:user") {
      if (d.authed === false) { S.profile = null; S.tok = { value: null, at: 0, ttl: 0, session: null, refreshing: null }; S.courses = []; S.course = null; S.openSlug = null; render(); }
      else post({ gin: "app:ready", view_id: LUT.viewId, weight: "dom" });
    }
  });

  /* ── boot ────────────────────────────────────────────────────────────────────────────────────── */
  function boot() {
    document.title = t("title");
    wire();
    $("#app").hidden = false;
    size(); render();
    post({ gin: "app:ready", view_id: LUT.viewId, weight: "dom" });
  }

  function init() {
    try {
      if (!componentProps || !Object.keys(componentProps).length) throw new Missing("* (props were not injected)");
      applyCSSProps();
      buildLUT();
      boot();
    } catch (e) {
      if (!(e instanceof Missing)) throw e;
      var box = document.createElement("pre");
      box.id = "fatal"; box.setAttribute("role", "alert");
      box.textContent = e.message + ".\nTeacher renders only from its componentProps (record props injected by the viewer).";
      document.body.replaceChildren(box);
    }
  }
  init();
})();
</script>
