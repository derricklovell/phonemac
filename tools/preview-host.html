<title>Phonemac Desktop</title>
<style>
  :root { --host-bg: #000; --toast-bg: rgba(28, 28, 30, 0.92); --toast-fg: #f5f5f7; }
  html, body { margin: 0; height: 100%; background: var(--host-bg); overflow: hidden; }
  #desktop { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 10px;
    background: var(--toast-bg); color: var(--toast-fg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 1; }
  #toast[data-show] { opacity: 1; }
</style>
<!-- Preview only: a stand-in for the 1ovr1 appshell (Record 50). It hosts the desktop the way the
     appshell hosts a tab — sandboxed srcdoc iframe, app:ready → app:restore with the signed-in user —
     so the desktop, and the records it hosts, run exactly as they will inside the appshell. The
     session below is sample data and its token is a placeholder, not a credential. -->
<iframe id="desktop" title="Desktop" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads" allow="clipboard-read; clipboard-write"></iframe>
<div id="toast" role="status"></div>
<script>
  var SESSION = {
    authed: true,
    user: { username: "sample-merchant", user_id: null, display_name: "Sample Studio", profile_picture_url: null, auth_token: "preview-sample-token" },
  };
  var frame = document.getElementById("desktop");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  window.received = [];

  function post(msg) { try { frame.contentWindow.postMessage(msg, "*"); } catch (e) {} }
  function toast(text) {
    toastEl.textContent = text;
    toastEl.setAttribute("data-show", "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.removeAttribute("data-show"); }, 3200);
  }

  addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow) return;
    var m = e.data;
    if (!m || typeof m.gin !== "string") return;
    window.received.push(m);
    if (m.gin === "app:ready") post({ gin: "app:restore", view_id: "desktop", state: null, ts: 0, authed: SESSION.authed, user: SESSION.user });
    if (m.gin === "chart:get") post({ gin: "chart:state", chart: null, viewing: null, viewingName: null });
    if (m.gin === "apps:open") toast("The appshell would open record " + m.view_id + (m.context ? " (" + JSON.stringify(m.context) + ")" : "") + ".");
  });

  fetch("desktop.html")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (html) { frame.srcdoc = html; })
    .catch(function (err) { toast("Could not load the desktop: " + err.message); });
</script>
