<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ── tokens: neutral until the merchant's site theme arrives (applyTheme derives every token from it) — the token
   names and the layout are the muaScheduler design system's (app/globals.css), so a merchant with that theme gets it 1:1 */
:root{--background:#0b0b0c;--foreground:#e8e8e8;--card:#151517;--card-foreground:#e8e8e8;--popover:#131315;--popover-foreground:#e8e8e8;--primary:#e8e8e8;--primary-foreground:#0b0b0c;--secondary:#cfcfd2;--muted:#1a1a1c;--muted-foreground:#9a9a9f;--accent:#232326;--accent-foreground:#e8e8e8;--destructive:#e07a5f;--border:#2a2a2c;--input:#232326;--ring:#e8e8e8;--sidebar:#0f0f10;--sidebar-border:#2a2a2c;--radius:.25rem;--r-sm:0px;--r-md:2px;--r-lg:.25rem;--r-xl:.5rem;--font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--font-serif:Georgia,serif}
*,*::before,*::after{box-sizing:border-box;border:0 solid var(--border)}
html{-webkit-text-size-adjust:100%;font-family:var(--font-sans);line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--background);color:var(--foreground);font-size:16px;min-height:100vh}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit;margin:0}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
img{display:block;max-width:100%}
svg{display:block;flex-shrink:0;pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hidden{display:none!important}
/* text */
.t-xs{font-size:.75rem;line-height:1rem}.t-sm{font-size:.875rem;line-height:1.25rem}.t-base{font-size:1rem;line-height:1.5rem}.t-lg{font-size:1.125rem;line-height:1.75rem}.t-2xl{font-size:1.5rem;line-height:2rem}
.f-med{font-weight:500}.f-semi{font-weight:600}.f-bold{font-weight:700}
.c-muted{color:var(--muted-foreground)}.c-fg{color:var(--foreground)}.c-primary{color:var(--primary)}.c-destr{color:var(--destructive)}
.c-muted70{color:color-mix(in oklab,var(--muted-foreground) 70%,transparent)}
.upper{text-transform:uppercase}.track-wide{letter-spacing:.025em}.track-wider{letter-spacing:.05em}
.center{text-align:center}.left{text-align:left}
.i3{width:.75rem;height:.75rem}.i35{width:.875rem;height:.875rem}.i4{width:1rem;height:1rem}.i5{width:1.25rem;height:1.25rem}.i8{width:2rem;height:2rem}
/* layout helpers */
.flex{display:flex}.col{flex-direction:column}.items-c{align-items:center}.items-s{align-items:flex-start}.jc-b{justify-content:space-between}.jc-c{justify-content:center}.flex1{flex:1 1 0%}
.gap1{gap:.25rem}.gap2{gap:.5rem}.gap3{gap:.75rem}
.sp-y-2>*+*{margin-top:.5rem}.sp-y-3>*+*{margin-top:.75rem}.sp-y-4>*+*{margin-top:1rem}.sp-y-6>*+*{margin-top:1.5rem}
.mt1{margin-top:.25rem}.mt2{margin-top:.5rem}.mb2{margin-bottom:.5rem}
.p3{padding:.75rem}
.rounded-md{border-radius:var(--r-md)}.rounded-lg{border-radius:var(--r-lg)}.rounded-full{border-radius:9999px}
.bg-accent30{background:color-mix(in oklab,var(--accent) 30%,transparent)}.bg-primary10{background:color-mix(in oklab,var(--primary) 10%,transparent)}
.break{overflow-wrap:anywhere}
.w-full{width:100%}
/* ── the page (BookingScheduler root) ────────────────────────────────────────────────────────────────────── */
#app{min-height:100vh}
.page{min-height:100vh;background:var(--background);color:var(--foreground);display:flex;align-items:flex-start;justify-content:center;padding:.5rem;overflow-y:auto;animation:fade-up .6s ease-out both}
.back{position:absolute;top:1rem;left:1rem;z-index:50;display:flex;align-items:center;gap:.5rem;color:var(--muted-foreground);padding:.25rem;border-radius:var(--r-md);transition:color .15s}
.back:hover{color:var(--foreground)}
.back:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.wrap{width:100%;max-width:1600px;margin:0 auto}
/* step indicator */
.steps{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.5rem}
.step-item{display:flex;align-items:center}
.pill{display:flex;align-items:center;gap:.5rem;padding:.375rem .75rem;border-radius:9999px;font-size:.75rem;line-height:1rem;font-weight:500;transition:color .15s,background-color .15s;background:var(--muted);color:var(--muted-foreground);animation:pill-in .35s ease-out both}
.pill.active{background:var(--primary);color:var(--primary-foreground)}
.pill.done{background:color-mix(in oklab,var(--primary) 20%,transparent);color:var(--primary)}
.pill .lbl{display:none}.pill .num{display:inline}
.step-line{width:2rem;height:.125rem;margin:0 .25rem;background:var(--border);transition:background-color .15s}
.step-line.done{background:var(--primary)}
/* card */
.card{display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;background:var(--card);border:1px solid var(--border);min-height:500px;width:100%;animation:card-in .5s ease-out .1s both}
.side{width:100%;background:var(--sidebar);border-bottom:1px solid var(--sidebar-border);padding:1rem;flex-shrink:0;animation:slide-x .5s ease-out .2s both}
.side>.inner>*{animation:fade-up .4s ease-out both}
.avatar{width:2.5rem;height:2.5rem;border-radius:9999px;overflow:hidden;position:relative;display:flex;flex-shrink:0;background:var(--muted);align-items:center;justify-content:center;font-size:.875rem;color:var(--foreground)}
.avatar img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;aspect-ratio:1/1}
.side h1{font-size:1.5rem;line-height:2rem;font-weight:500;color:var(--foreground)}
.main-dt{flex:1 1 0%;display:flex;flex-direction:column;overflow:hidden}
.cal{flex:1 1 0%;padding:1rem;animation:fade-up .4s ease-out .3s both}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cal-head h2{font-size:1rem;line-height:1.5rem;font-weight:600;color:var(--foreground)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.375rem}
.dow{height:2rem;display:flex;align-items:center;justify-content:center;font-size:.75rem;line-height:1rem;color:var(--muted-foreground);font-weight:500}
.day,.day-empty{height:2.5rem}
.day{border-radius:var(--r-md);font-size:.875rem;line-height:1.25rem;font-weight:500;transition:color .15s,background-color .15s,transform .15s;position:relative;color:var(--foreground);display:flex;align-items:center;justify-content:center;width:100%}
.day.today{border:1px solid var(--primary);color:var(--primary)}
.day.selected{background:var(--primary);color:var(--primary-foreground)}
.day.off{color:color-mix(in oklab,var(--muted-foreground) 30%,transparent);cursor:not-allowed}
.day.can:not(.selected):hover{background:var(--accent);color:var(--foreground);transform:scale(1.1)}
.day.can:not(.selected):active{transform:scale(.95)}
.day.locked{cursor:not-allowed;opacity:.5}
.day .dot{position:absolute;bottom:.125rem;left:50%;transform:translateX(-50%);width:.25rem;height:.25rem;border-radius:9999px;background:var(--primary)}
.slots{width:100%;padding:1rem;display:flex;flex-direction:column;border-top:1px solid var(--border);animation:slide-x-r .4s ease-out .4s both}
.slots-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.slots-head h3{font-size:.875rem;line-height:1.25rem;font-weight:500;color:var(--foreground)}
.tf{display:inline-flex;border-radius:var(--r-md);padding:.25rem;background:var(--background);border:1px solid var(--border)}
.tf button{padding:.25rem .75rem;font-size:.75rem;line-height:1rem;font-weight:500;border-radius:var(--r-md);color:var(--muted-foreground);transition:color .15s,background-color .15s}
.tf button:hover{color:var(--foreground)}
.tf button.on{background:var(--primary);color:var(--primary-foreground)}
.scroll{flex:1 1 0%;margin:0 -.5rem;padding:0 .5rem;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.slot-list>*+*{margin-top:.5rem}
.slot-list>*{animation:slide-x-r .3s ease-out both}
.slot-btn{font-size:.75rem;line-height:1rem}
.slot-empty{font-size:.875rem;line-height:1.25rem;color:var(--muted-foreground);text-align:center;padding:1rem 0}
.continue{padding-top:1rem;margin-top:1rem;border-top:1px solid var(--border);animation:fade-up .3s ease-out both}
.main-form{flex:1 1 0%;padding:1rem;display:flex;flex-direction:column;min-height:0;min-width:0;animation:slide-x-r .3s ease-out both}
.main-form h2{font-size:1.125rem;line-height:1.75rem;font-weight:600;color:var(--foreground);margin-bottom:1rem;flex-shrink:0}
.form-body{flex:1 1 0%;min-height:0;padding-right:.5rem}
.form-foot{display:flex;gap:.75rem;padding-top:1rem;border-top:1px solid var(--border);margin-top:1rem;flex-shrink:0}
.step-anim{animation:slide-x-r .3s ease-out both}
/* buttons (components/ui/button.tsx) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap;border-radius:var(--r-md);font-size:.875rem;line-height:1.25rem;font-weight:500;transition:color .15s,background-color .15s,border-color .15s,box-shadow .15s,opacity .15s;height:2.25rem;padding:.5rem 1rem;flex-shrink:0;outline:none}
.btn:has(>svg){padding-left:.75rem;padding-right:.75rem}
.btn:disabled{pointer-events:none;opacity:.5}
.btn:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}
.btn-default{background:var(--primary);color:var(--primary-foreground)}.btn-default:hover{background:color-mix(in oklab,var(--primary) 90%,transparent)}
.btn-outline{border:1px solid var(--input);background:color-mix(in oklab,var(--input) 30%,transparent);box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}.btn-outline:hover{background:color-mix(in oklab,var(--input) 50%,transparent);color:var(--accent-foreground)}
.btn-outline.bg-transparent{background:transparent}.btn-outline.bg-transparent:hover{background:color-mix(in oklab,var(--input) 50%,transparent)}
.btn-ghost:hover{background:color-mix(in oklab,var(--accent) 50%,transparent);color:var(--accent-foreground)}
.h8w8{height:2rem!important;width:2rem!important;padding:0!important}.h6w6{height:1.5rem!important;width:1.5rem!important;padding:0!important}
/* inputs (components/ui/input.tsx, textarea.tsx, label.tsx) */
.label{display:flex;align-items:center;gap:.5rem;font-size:.875rem;line-height:1;font-weight:500;user-select:none;color:var(--muted-foreground)}
.input{height:2.25rem;width:100%;min-width:0;border-radius:var(--r-md);border:1px solid var(--input);background:color-mix(in oklab,var(--input) 30%,transparent);padding:.25rem .75rem;font-size:.875rem;line-height:1.25rem;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);transition:color .15s,box-shadow .15s,border-color .15s;outline:none;color:var(--foreground)}
.input::placeholder,.textarea::placeholder{color:var(--muted-foreground)}
.input:focus-visible,.textarea:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}
.input.err,.textarea.err,.btn.err{border-color:var(--destructive)}
.input.pl10{padding-left:2.5rem}
.textarea{display:block;min-height:60px;width:100%;border-radius:var(--r-md);border:1px solid var(--input);background:color-mix(in oklab,var(--input) 30%,transparent);padding:.5rem .75rem;font-size:.875rem;line-height:1.25rem;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);outline:none;resize:vertical;color:var(--foreground)}
.field{position:relative}
.field>svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%)}
.ferr{font-size:.75rem;line-height:1rem;color:var(--destructive)}
.ferr:empty{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
/* location select (components/ui/select.tsx, location-select.tsx) */
.sel{position:relative}
.sel-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:transparent;padding:0;height:auto;font-weight:400;color:var(--muted-foreground);font-size:.875rem;line-height:1.25rem;border:0;transition:color .15s}
.sel-trigger:hover{color:var(--foreground)}
.sel-trigger .chev{opacity:.5}
.sel-menu{position:absolute;left:0;top:calc(100% + .25rem);z-index:50;min-width:100%;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1);padding:.25rem;animation:pop-in .15s ease-out both}
.sel-item{position:relative;display:flex;width:100%;cursor:default;align-items:center;gap:.5rem;border-radius:var(--r-sm);padding:.375rem 2rem .375rem .5rem;font-size:.875rem;line-height:1.25rem;color:var(--muted-foreground);user-select:none}
.sel-item:hover,.sel-item:focus{background:var(--accent);color:var(--accent-foreground);outline:none}
.sel-item .chk{position:absolute;right:.5rem;display:flex;width:.875rem;height:.875rem;align-items:center;justify-content:center}
.addr-box{padding:.75rem;background:color-mix(in oklab,var(--muted) 50%,transparent);border-radius:var(--r-lg);border:1px solid var(--border)}
.addr-btn{width:100%;height:5rem;justify-content:flex-start;text-align:left}
/* confirmation */
.sum{background:color-mix(in oklab,var(--accent) 30%,transparent);border-radius:var(--r-lg);padding:1rem}
.sum h4{font-size:.875rem;line-height:1.25rem;font-weight:500;color:var(--foreground);margin-bottom:.5rem}
.row{display:flex;justify-content:space-between;font-size:.875rem;line-height:1.25rem}
/* payment section (light card inside the dark page — globals.css .payment-section-light) */
.pay{background:#fff;border:1px solid #e5e7eb;border-radius:var(--r-lg);padding:1rem;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);color:#1f2937}
.pay h4{font-size:.875rem;line-height:1.25rem;font-weight:500;color:#111827;margin-bottom:1rem}
.pay .c-muted{color:#6b7280}.pay .c-fg{color:#111827}
.sdk-note{margin-bottom:1rem;padding:.75rem;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--r-lg)}
.sdk-note .l1{display:flex;align-items:center;gap:.5rem;font-size:.875rem;line-height:1.25rem;color:#1e40af}
.sdk-note .l2{font-size:.75rem;line-height:1rem;color:#2563eb;margin-top:.25rem}
.sdk-note .er{font-size:.75rem;line-height:1rem;color:#dc2626;margin-top:.25rem}
.pay-sep{padding-top:.5rem;border-top:1px solid var(--border)}
.methods{width:100%;display:flex;gap:.5rem;justify-content:center}
.method{position:relative;flex:1 1 0%;min-width:90px;display:flex;flex-direction:column;align-items:center;padding:.75rem;border:1px solid #d1d5db;border-radius:var(--r-lg);cursor:pointer;background:#fff;color:#374151;transition:background-color .15s}
.method:hover{background:#f9fafb}
.method.on{border-color:var(--primary);background:#fdf2f8;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}
.method .ico{display:flex;color:#111827}.method .ico svg{width:1.75rem;height:1.75rem}
.method .mlabel{margin-top:.375rem;font-size:.75rem;line-height:1rem;color:#374151;font-weight:500}
.method input{position:absolute;width:1px;height:1px;opacity:0}
.esp{padding:24px;border-radius:16px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px 0 rgba(0,0,0,.06)}
.esp .ph{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem}
.esp .ph .ib{padding:.5rem;background:#fce7f3;border-radius:var(--r-lg)}
.esp .ph h3{font-size:1.125rem;line-height:1.75rem;font-weight:700;letter-spacing:-.025em;color:#111827}
.esp .ph p{font-size:.875rem;line-height:1.25rem;color:#4b5563}
.esp .lab{display:flex;align-items:center;gap:.5rem;font-size:.875rem;line-height:1.25rem;font-weight:500;color:#111827}
.sqc{border:2px solid #d1d5db;border-radius:12px;padding:20px;background:#fff;transition:all .3s ease;min-height:120px;position:relative;overflow:hidden;margin-top:.75rem}
.sqc:focus-within{border-color:#d4a5a5;box-shadow:0 0 0 3px rgba(212,165,165,.1);transform:translateY(-1px)}
.sec{background:#f9fafb;border-radius:12px;padding:16px;border:1px solid #e5e7eb;margin-top:1.5rem}
.sec .l1{display:flex;align-items:center;justify-content:center;gap:24px;font-size:.75rem;line-height:1rem;color:#4b5563}
.sec .l1>div{display:flex;align-items:center;gap:.5rem}
.sec .l2{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.75rem;line-height:1rem;color:#4b5563;margin-top:.75rem}
.sec .sq{width:1rem;height:1rem;background:linear-gradient(to bottom right,#3b82f6,#2563eb);border-radius:var(--r-md);color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center}
.paybtn{margin-top:1.5rem;width:100%;height:3rem;font-size:1rem;line-height:1.5rem;font-weight:600;border-radius:var(--r-md);background:linear-gradient(to right,var(--primary),color-mix(in oklab,var(--primary) 80%,transparent));color:var(--primary-foreground);box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.paybtn:hover:not(:disabled){background:linear-gradient(to right,color-mix(in oklab,var(--primary) 90%,transparent),color-mix(in oklab,var(--primary) 70%,transparent));box-shadow:0 20px 25px -5px rgb(0 0 0/.1),0 8px 10px -6px rgb(0 0 0/.1);transform:translateY(-2px)}
.paybtn:disabled{opacity:.5;pointer-events:none}
.pbreak{margin-top:.75rem;padding:.75rem;background:#f9fafb;border:1px solid #e5e7eb;border-radius:var(--r-lg)}
.pbreak .r1{display:flex;justify-content:space-between;align-items:center;font-size:.875rem;line-height:1.25rem;color:#4b5563}
.pbreak .r1 b{font-weight:600;color:#111827}
.pbreak .r2{font-size:.75rem;line-height:1rem;color:#4b5563;margin-top:.25rem}
.pbreak .er{margin-top:.5rem;padding:.5rem;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r-md);font-size:.875rem;line-height:1.25rem;color:#b91c1c}
.pbreak .pr{margin-top:.5rem;padding:.5rem;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--r-md);font-size:.875rem;line-height:1.25rem;color:#1d4ed8}
.pulse{width:100%;height:3rem;background:var(--muted);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite;font-size:.875rem;color:var(--muted-foreground)}
.unavail{width:100%;height:3rem;background:color-mix(in oklab,var(--destructive) 10%,transparent);border:1px solid color-mix(in oklab,var(--destructive) 20%,transparent);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:.875rem;color:var(--destructive)}
.spin{animation:spin 1s linear infinite}
.spinner{width:1.25rem;height:1.25rem;border:2px solid rgb(255 255 255/.3);border-top-color:#fff;border-radius:9999px;animation:spin 1s linear infinite}
/* dialog (components/ui/dialog.tsx) */
.overlay{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.5);animation:fade .2s ease-out both}
.dialog{position:fixed;top:50%;left:50%;z-index:50;display:grid;width:100%;max-width:calc(100% - 2rem);transform:translate(-50%,-50%);gap:1rem;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--background);padding:1.5rem;box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);animation:zoom-in .2s ease-out both;max-height:90vh;overflow-y:auto}
.dialog .x{position:absolute;top:1rem;right:1rem;border-radius:var(--r-sm);opacity:.7;transition:opacity .15s}
.dialog .x:hover{opacity:1}
.dlg-head{display:flex;flex-direction:column;gap:.5rem;text-align:center}
.dlg-title{display:flex;align-items:center;gap:.5rem;font-size:1.125rem;line-height:1;font-weight:600;justify-content:center}
.dlg-desc{font-size:.875rem;line-height:1.25rem;color:var(--muted-foreground)}
.dlg-foot{display:flex;flex-direction:column-reverse;gap:.5rem}
.dlg-body{display:grid;gap:1rem;padding:1rem 0}
.dlg-body .label{color:var(--foreground)}
.grid-csz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.preview{margin-top:0;padding:.75rem;background:color-mix(in oklab,var(--muted) 50%,transparent);border-radius:var(--r-lg);border:1px solid var(--border)}
.preview .label{color:var(--muted-foreground)}
/* toast (sonner) */

  /* ── dates in the merchant's own calendar (strings, no client time zone involved) ─────────────── */
  function parseDate(s) { var p = s.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
  function dateKey(o) { return o.y + '-' + pad2(o.m) + '-' + pad2(o.d); }
  function addDays(o, n) { var t = new Date(Date.UTC(o.y, o.m - 1, o.d + n)); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; }

  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function cmp(a, b) { var x = dateKey(a), y = dateKey(b); return x < y ? -1 : x > y ? 1 : 0; }
  function toMins(t) { var p = t.split(':').map(Number); return p[0] * 60 + p[1]; }
  function fmtTime(t) {
    var p = t.split(':').map(Number);
    if (S.use24) return t;
    var period = p[0] >= 12 ? 'PM' : 'AM'; var h = p[0] % 12 || 12;
    return h + ':' + pad2(p[1]) + ' ' + period;
  }
  function fmtEEEMMMd(o) { return WEEKDAYS_SHORT[weekday(o)] + ', ' + MONTHS_SHORT[o.m - 1] + ' ' + o.d; }
  function fmtMMMddyyyy(o) { return MONTHS_SHORT[o.m - 1] + ' ' + pad2(o.d) + ', ' + o.y; }
  function fmtLong(o) { return WEEKDAYS[weekday(o)] + ', ' + MONTHS[o.m - 1] + ' ' + pad2(o.d) + ', ' + o.y; }

  /* generateSlotsFromSchedule, plus the slots other paid bookings already hold */
  function buildSlots() {
    var av = S.ctx.availability, dur = S.service.duration_minutes;
    var advance = av.advance_booking_days || 30, notice = S.staff ? 0 : (av.minimum_notice_hours || 0);
    var booked = S.ctx.booked || [];
    var slots = {};
    for (var off = 0; off < advance; off++) {
      var date = addDays(S.today, off), key = dateKey(date), mk = date.y + '-' + date.m, day = date.d;
      if (!slots[mk]) slots[mk] = {};
      var blocked = (av.blocked_dates || []).some(function (r) { var a = r.startDate || r.start_date, b = r.endDate || r.end_date; return a && key >= a && key <= b; });
      if (blocked) { slots[mk][day] = []; continue; }
      var ov = (av.date_overrides || []).filter(function (o) { return o.date === key; })[0];
      if (ov) {
        if (ov.blocked || ov.is_blocked) { slots[mk][day] = []; continue; }
        if (ov.slots && ov.slots.length) { slots[mk][day] = ov.slots.filter(function (s) { return s.available; }).map(function (s) { return s.time; }); continue; }
      }
      var dow = weekday(date);
      var sched = (av.weekly_schedule || []).filter(function (s) { return s.dayOfWeek === dow; })[0];
      if (!sched) { slots[mk][day] = []; continue; }
      var start = toMins(sched.startTime), end = toMins(sched.endTime), interval = sched.slotIntervalMinutes || 30, out = [];
      var held = booked.filter(function (b) { return b.date === key; });
      for (var mins = start; mins + dur <= end; mins += interval) {
        var t = pad2(Math.floor(mins / 60)) + ':' + pad2(mins % 60);
        var inBreak = (sched.breaks || []).some(function (b) { return mins >= toMins(b.startTime) && mins < toMins(b.endTime); });
        if (inBreak) continue;
        var taken = held.some(function (b) { return mins < b.start + b.duration && mins + dur > b.start; });
        if (taken) continue;
        if (off === 0) { if ((mins - S.nowMins) / 60 >= notice) out.push(t); } else out.push(t);
      }
      slots[mk][day] = out;
    }
    return slots;
  }
  function slotsFor(day, month, year) { var mk = year + '-' + (month + 1); return (S.slotCache[mk] && S.slotCache[mk][day]) || []; }

        address: { street: a.street || '', unit: a.unit || '', city: a.city || '', state: a.state || '', zip: a.zipCode || '', full: a.fullAddress || '' }, notes: f.notes.trim() }

  }
  function payWith(processor, token) {

  }

    try { window.parent.postMessage({ gin: 'route:changed', view_id: VIEW_ID, route: '/success?id=' + b.id + '&t=' + b.token }, '*'); } catch (e) {}

  }
  function paymentFailed(msg, inBrowser) {

    if (/taken/i.test(msg)) refreshBooked();
    if (inBrowser) syncLead('payment_failed', { error: msg, method: S.method });   /* a failure the server never saw; its own it records in booking/settle */
  }
  function setProcessing(on) { S.processing = on; var b = $('#pay-now'); if (b) { b.disabled = on || !S.sq.card; b.innerHTML = on ? '<div class="spinner"></div><span>Processing Payment...</span>' : ic('check-circle', 'i5') + '<span>Pay ' + money(depositCents(), S.ctx.payment.currency) + ' &amp; Book Now</span>'; } $$('input[name=paymentMethod]').forEach(function (r) { r.disabled = on; }); }
  function refreshBooked() { api('GET', '/booking/context?merchant_id=' + MERCHANT_ID + '&channel=' + CHANNEL).then(function (c) { if (c && c.ok) { S.ctx.booked = c.booked; S.slotCache = buildSlots(); } }).catch(function () {}); }

  function toast(msg, isErr) {
    var t = $('#toast'); if (!t) return;
    t.innerHTML = '<div class="toast' + (isErr ? ' err' : '') + '" role="status">' + (isErr ? '' : ic('check-circle', 'i4', 'color:#22c55e;margin-top:.125rem')) + '<span>' + esc(msg) + '</span></div>';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.innerHTML = ''; }, 4000);
  }

  /* ── steps ─────────────────────────────────────────────────────────────────────────────────────── */
  function nextStep() {
    if (S.step === 'datetime' && S.selectedDate && S.selectedTime) { S.step = 'details'; renderMain(); }
    else if (S.step === 'details') {
      var errs = validateDetails();
      if (Object.keys(errs).length) { S.errors = errs; renderDetails(); return; }
      S.errors = {}; S.step = 'confirmation'; renderMain();
      syncLead('details');
    }
  }
  function prevStep() {
    parkSquareWidgets(); S.payError = '';
    if (S.step === 'confirmation') S.step = 'details'; else if (S.step === 'details') S.step = 'datetime';
    renderMain();
  }

  /* ── success page (app/book/success/page.tsx) ──────────────────────────────────────────────────── */
  function showSuccess(id, token) {
    parkSquareWidgets();
    app.innerHTML = '<div class="loading">Loading...</div>';
    api('GET', '/booking/status?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(token)).then(function (s) { paintSuccess(id, s && s.ok ? s : null); }).catch(function () { paintSuccess(id, null); });
  }
  function paintSuccess(id, s) {
    var m = (s && s.merchant) || (S.ctx && S.ctx.merchant) || {};
    var links = (s && s.links) || (S.ctx && S.ctx.links) || {};
    var email = links.email || m.email || '', phone = m.phone || '';
    app.innerHTML =
      '<div class="success"><div class="scard">' +
        '<div class="ok">' + ic('check-circle', 'i8') + '</div>' +
        '<h1>Booking Confirmed!</h1>' +
        '<p class="lead">Your appointment has been successfully booked. You\'ll receive a confirmation email shortly with all the details.</p>' +
        (id ? '<div class="idbox"><b>Booking ID:</b> #' + esc(id) + '</div>' : '') +
        '<div class="sp-y-3">' +
          '<a class="btn btn-default w-full" href="' + esc(homeHref()) + '" target="_top">' + ic('home', 'i4') + 'Return Home</a>' +
          '<button type="button" class="btn btn-outline bg-transparent w-full" id="again">' + ic('calendar', 'i4') + 'Book Another Service</button>' +
        '</div>' +
        '<div class="next"><div><p><b>What\'s next?</b></p><ul><li>• Your appointment will be confirmed within 24 hours</li><li>• Check your email for confirmation details</li><li>• You\'ll receive any preparation instructions</li></ul></div>' +
          '<div class="help"><p><b>Need help?</b></p><div class="links">' + (email ? '<a href="mailto:' + esc(email) + '">' + ic('mail', 'i3') + 'Email</a>' : '') + (phone ? '<a href="tel:' + esc(phone.replace(/[^+\d]/g, '')) + '">' + ic('phone', 'i3') + 'Call</a>' : '') + '</div></div></div>' +
      '</div></div>';
    $('#again').onclick = function () {
      try { window.parent.postMessage({ gin: 'route:changed', view_id: VIEW_ID, route: '/' }, '*'); } catch (e) {}
      S.step = 'datetime'; S.selectedDate = null; S.selectedTime = null; S.paySuccess = false; S.payError = ''; S.errors = {};
      if (!S.ctx) { boot(); return; }
      refreshBooked(); renderShell();
    };
  }

    /* ── the desk is not in this page. Its code lives in this record's s02 as parts the platform hands out by role
     (GET app/module, manifest.parts): a visitor never receives it; the people who work the business get "desk", owners
     and admins also "manage". This seam loads a part and gives it the page's interface. ── */
  S.auth = null; S.user = null; S.desk = null; S.mode = 'visitor'; S.staff = false; S.visitorDue = null; S.deskTried = false; S.sdkStarted = false;
  var DESK = null, PARTS = {};
  function loadPart(part, kit) {
    if (PARTS[part]) return PARTS[part];
    var url = API + '/app/module?view=' + VIEW_ID + '&part=' + encodeURIComponent(part) + '&merchant_id=' + MERCHANT_ID;
    var p = fetch(url, { headers: { 'Authorization': 'Bearer ' + S.auth, 'x-merchant-id': String(MERCHANT_ID) } })
      .then(function (r) { return r.text().then(function (t) { if (!r.ok) { var msg = ''; try { msg = JSON.parse(t).message; } catch (e) {} throw new Error(msg || ('part ' + part + ': HTTP ' + r.status)); } return t; }); })
      .then(function (code) {
        return new Promise(function (res, rej) {
          var got = false;
          window.__ginModule = function (name, factory) { got = true; window.__ginModule = undefined; try { res(factory(kit)); } catch (e) { rej(e); } };
          var s = document.createElement('script'); s.textContent = code + '\n//# sourceURL=app-' + VIEW_ID + '-' + part + '.js';
          document.head.appendChild(s); s.parentNode.removeChild(s);
          if (!got) { window.__ginModule = undefined; rej(new Error('part ' + part + ' did not load')); }
        });
      });
    PARTS[part] = p; p.catch(function () { delete PARTS[part]; });
    return p;
  }
  function deskKit() {
    return { '$': $, '$$': $$, CHANNEL: CHANNEL, IN_SHELL: IN_SHELL, MERCHANT_ID: MERCHANT_ID, PATHS: PATHS, S: S, VIEW_ID: VIEW_ID, WEEKDAYS: WEEKDAYS, addDays: addDays, api: api, app: app, applyTheme: applyTheme, buildSlots: buildSlots, businessAddress: businessAddress, dateKey: dateKey, depositCents: depositCents, esc: esc, fmtLong: fmtLong, fmtTime: fmtTime, ic: ic, money: money, pad2: pad2, parkSquareWidgets: parkSquareWidgets, parseDate: parseDate, renderShell: renderShell, toMins: toMins, toast: toast, totalCents: totalCents, uuid: uuid, visitorNow: visitorNow, loadPart: loadPart };
  }
  function tryDesk() {
    if (DESK) { DESK.tryDesk(); return; }
    loadPart('desk', deskKit()).then(function (m) { DESK = m; m.tryDesk(); }).catch(function () { S.auth = null; visitorNow(); });
  }
  function renderDesk() { if (DESK) DESK.renderDesk(); }
  function renderDeskConfirmation() { if (DESK) DESK.renderDeskConfirmation(); }

  /* ── boot ──────────────────────────────────────────────────────────────────────────────────────── */
  function fatal(title, msg) { app.innerHTML = '<div class="fatal"><div><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p></div></div>'; }
  function boot() {
    if (!MERCHANT_ID) { fatal('Unable to load booking system', 'No business is attached to this page.'); return; }
    api('GET', '/booking/context?merchant_id=' + MERCHANT_ID + '&channel=' + CHANNEL).then(function (c) {
      if (!c || !c.ok) throw new Error((c && (c.message || c.error)) || 'context');
      S.ctx = c; S.tz = c.availability.timezone; S.today = parseDate(c.now.date); S.nowMins = toMins(c.now.time);
      applyTheme(c.theme, c.tokens);
      S.month = S.today.m - 1; S.year = S.today.y;
      var dflt = (c.form && c.form.default_service) || 'natural-beat';
      var slug = Q.service || dflt;
      S.service = c.services.filter(function (s) { return s.slug === slug; })[0] || c.services.filter(function (s) { return s.slug === dflt; })[0] || c.services[0];
      if (!S.service) { app.innerHTML = '<div class="fatal"><div><h1 class="t-2xl c-fg" style="font-family:var(--font-serif);margin-bottom:1rem">No Services Available</h1><a class="c-primary" href="' + esc(homeHref()) + '" target="_top" style="text-decoration:underline">Return to Home</a></div></div>'; return; }
      S.address = businessAddress();
      S.slotCache = buildSlots();
      if (c.merchant && c.merchant.favicon) { var l = document.createElement('link'); l.rel = 'icon'; l.href = c.merchant.favicon; document.head.appendChild(l); }
      document.title = ((c.provider && c.provider.title) || 'Schedule Services') + ' · ' + (c.merchant.name || '');
      if (Q.success_id && Q.success_t) { showSuccess(Q.success_id, Q.success_t); return; }

      if (tok && MERCHANT_ID) { S.auth = tok; tryDesk(); } else visitorNow();

    if (d.gin === 'route:set' && typeof d.route === 'string' && d.route.indexOf('/success') === 0) {
      var m1 = d.route.match(/[?&]id=(\d+)/), m2 = d.route.match(/[?&]t=([^&]+)/);
      if (m1 && m2) { var go = function () { showSuccess(m1[1], decodeURIComponent(m2[1])); }; if (S.ctx) go(); else setTimeout(go, 1200); }
    }
  });
  try { window.parent.postMessage({ gin: 'app:ready', view_id: VIEW_ID, weight: 'dom' }, '*'); } catch (e) {}
  boot();
})();
