<!doctype html>
<!-- STAND-IN for the Messages record. It is served as `${viewEndpoint}_iframe?view=<id>` in local tests
     and the preview, so the shell's loading, gin: handshake, window drag/resize and sleep/wake can be
     exercised before the real record can be fetched. Its data is sample data, not anyone's inbox. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages (stand-in)</title>
<style>
  :root { color-scheme: light; --bg: #fff; --side: #f5f5f7; --line: #e5e5ea; --text: #1d1d1f; --muted: #8e8e93; --me: #0a84ff; --them: #e9e9eb; --sel: #0a84ff; }
  :root.dark { color-scheme: dark; --bg: #1c1c1e; --side: #2c2c2e; --line: #3a3a3c; --text: #f5f5f7; --muted: #98989d; --me: #0a84ff; --them: #3a3a3c; --sel: #0a84ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .app { display: flex; height: 100%; }
  .side { width: 240px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side h1 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 14px 6px; text-transform: uppercase; letter-spacing: .04em; }
  .list { overflow-y: auto; flex: 1; padding: 0 6px 6px; }
  .chat { all: unset; display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px; border-radius: 8px; cursor: default; box-sizing: border-box; }
  .chat[aria-current="true"] { background: var(--sel); color: #fff; }
  .chat[aria-current="true"] .prev { color: rgba(255,255,255,.8); }
  .av { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(#a1a1aa, #71717a); color: #fff; display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }
  .who { font-weight: 600; } .prev { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--me); margin-left: auto; flex-shrink: 0; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .size { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-weight: 400; }
  .thread { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .b { max-width: 70%; padding: 7px 12px; border-radius: 18px; background: var(--them); align-self: flex-start; }
  .b.me { background: var(--me); color: #fff; align-self: flex-end; }
  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  input { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 16px; padding: 6px 12px; font: inherit; }
  .note { padding: 6px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .side { width: 100%; } .app[data-view="thread"] .side, .app[data-view="list"] .main { display: none; } }
</style>
</head>
<body>
<div class="app" data-view="list">
  <aside class="side"><h1>Messages</h1><div class="list" id="list"></div></aside>
  <section class="main">
    <div class="head"><span id="title"></span><span class="size" id="size" title="This frame's size, live"></span></div>
    <div class="thread" id="thread"></div>
    <form id="send"><input id="text" placeholder="iMessage" autocomplete="off"></form>
    <div class="note">Stand-in record (sample data). The real Messages record loads from the database once its id is set.</div>
  </section>
</div>
<script>
var CHATS = [
  { id: "sam", name: "Sam", unread: true, msgs: [["them", "are we still on for friday?"], ["me", "yes! 7pm"], ["them", "perfect, see you there"]] },
  { id: "jo", name: "Jo", unread: true, msgs: [["them", "sent you the deck"], ["them", "lmk what you think"]] },
  { id: "team", name: "Design team", unread: false, msgs: [["them", "new icons are in figma"], ["me", "looking now"]] },
  { id: "mom", name: "Mom", unread: true, msgs: [["them", "call me when you can"]] },
];
var state = { open: null, sent: {} };
var app = document.querySelector(".app");

function post(m) { try { parent.postMessage(m, "*"); } catch (e) {} }
function unread() { return CHATS.filter(function (c) { return c.unread; }).length; }
function initials(n) { return n.split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase(); }

function render() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  CHATS.forEach(function (c) {
    var b = document.createElement("button");
    b.className = "chat";
    b.setAttribute("aria-current", String(state.open === c.id));
    var last = (state.sent[c.id] || []).slice(-1)[0] || c.msgs[c.msgs.length - 1][1];
    b.innerHTML = '<span class="av"></span><span><div class="who"></div><div class="prev"></div></span>' + (c.unread ? '<span class="dot"></span>' : "");
    b.querySelector(".av").textContent = initials(c.name);
    b.querySelector(".who").textContent = c.name;
    b.querySelector(".prev").textContent = last;
    b.onclick = function () { openChat(c.id); };
    list.appendChild(b);
  });
  var c = CHATS.filter(function (x) { return x.id === state.open; })[0];
  document.getElementById("title").textContent = c ? c.name : "No conversation selected";
  var t = document.getElementById("thread");
  t.innerHTML = "";
  if (c) c.msgs.concat((state.sent[c.id] || []).map(function (s) { return ["me", s]; })).forEach(function (m) {
    var d = document.createElement("div");
    d.className = "b" + (m[0] === "me" ? " me" : "");
    d.textContent = m[1];
    t.appendChild(d);
  });
  t.scrollTop = t.scrollHeight;
  app.dataset.view = c ? "thread" : "list";
  post({ gin: "messages:unread", n: unread() });
}

function openChat(id, quiet) {
  state.open = id;
  CHATS.forEach(function (c) { if (c.id === id) c.unread = false; });
  render();
  if (!quiet) {
    post({ gin: "app:state", state: state });
    post({ gin: "route:changed", route: "/chat/" + id });
  }
}

document.getElementById("send").onsubmit = function (e) {
  e.preventDefault();
  var v = document.getElementById("text").value.trim();
  if (!v || !state.open) return;
  (state.sent[state.open] = state.sent[state.open] || []).push(v);
  document.getElementById("text").value = "";
  render();
  post({ gin: "app:state", state: state });
};

function showSize() { document.getElementById("size").textContent = innerWidth + "×" + innerHeight; }
addEventListener("resize", showSize);
showSize();

addEventListener("message", function (e) {
  var m = e.data;
  if (!m || typeof m.gin !== "string") return;
  if (m.scheme) document.documentElement.classList.toggle("dark", m.scheme === "dark");
  if (m.gin === "app:restore" && m.state && typeof m.state === "object") {
    state.sent = m.state.sent || {};
    if (m.state.open) openChat(m.state.open, true);
  }
  if (m.gin === "route:set" && /^\/chat\//.test(m.route)) openChat(m.route.slice(6), true);
  document.body.dataset.lastGin = m.gin;
});

render();
post({ gin: "app:ready", weight: "dom" });
</script>
</body>
</html>
